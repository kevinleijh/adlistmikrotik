# Mikrotik Adlist with whitelist

name: Update Adlist

on:
  schedule:
    - cron: '0 0 * * *'  # Every day at midnight UTC
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Fetch upstream adlist
      run: |
        curl -s -o upstream.txt https://raw.githubusercontent.com/hagezi/dns-blocklists/main/hosts/pro.txt

    - name: Remove upstream header and add custom header
      run: |
        echo "#title: Mikrotik blocklist with whitelist" > adlist.txt
        echo "#description: Hagezi blocklist for Mikrotik with whitelist." >> adlist.txt
        echo "" >> adlist.txt
        grep -v '^#' upstream.txt >> adlist.txt

    - name: Filter out whitelisted domains
      run: |
        while IFS= read -r domain; do
          sed -i "/$domain/d" adlist.txt
        done < whitelist.txt

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add adlist.txt
        git commit -m "Update adlist with custom Mikrotik header and whitelist applied" || echo "No changes to commit"
        git push
